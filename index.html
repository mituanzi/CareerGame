<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>职业觉醒实验室</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-layer"></div>

    <!-- 1. 首页：身份选择 -->
    <div id="screen-id" class="container active">
        <div class="screen">
            <div class="main-title">职业觉醒实验室</div>
            <div class="sub-title">每一次选择，都是未来的伏笔</div>
            <div class="id-grid">
                <div class="id-card" onclick="Game.selectIdentity('student')">
                    <span class="id-icon">🎓</span>
                    <div class="id-name">我是学生</div>
                    <div class="id-desc">面对未来，我想知道自己适合走向何方</div>
                </div>
                <div class="id-card" onclick="Game.selectIdentity('worker')">
                    <span class="id-icon">💼</span>
                    <div class="id-name">我是打工人</div>
                    <div class="id-desc">面对当下，我想确认此刻的状态是否健康</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 角色选择页 -->
    <div id="screen-role" class="container">
        <div class="screen">
            <div class="main-title">选择剧本</div>
            
            <!-- 新增：模式选择开关 -->
            <div class="mode-switcher">
                <button id="btn-mode-deep" class="mode-btn active" onclick="Game.selectMode('deep')">深度评测 (全部题目)</button>
                <button id="btn-mode-shallow" class="mode-btn" onclick="Game.selectMode('shallow')">浅度评测 (15题)</button>
            </div>

            <p id="role-intro" style="color: #666; font-size: 14px; margin-bottom: 20px;">年轻的你站在人生的岔路口...</p>
            <div id="role-container" class="role-grid">
                <!-- 角色卡片由JS生成 -->
            </div>
        </div>
    </div>

    <!-- 3. 游戏主界面 -->
    <div id="screen-game" class="container">
        <div class="game-hud">
            <div id="hud-time">周一 09:00</div>
            <div id="hud-role">[角色名]</div>
        </div>
        
        <div class="stats-row">
            <div class="stat-ring" data-key="energy">
                <svg viewBox="0 0 100 100" class="ring-svg">
                    <circle class="ring-bg" cx="50" cy="50" r="42"></circle>
                    <circle class="ring-fg" id="ring-energy" cx="50" cy="50" r="42"></circle>
                </svg>
                <div class="ring-center">
                    <div class="stat-val" id="val-energy">100</div>
                    <div class="stat-lbl">⚡️ 能量</div>
                </div>
            </div>
            <div class="stat-ring" data-key="meaning">
                <svg viewBox="0 0 100 100" class="ring-svg">
                    <circle class="ring-bg" cx="50" cy="50" r="42"></circle>
                    <circle class="ring-fg" id="ring-meaning" cx="50" cy="50" r="42"></circle>
                </svg>
                <div class="ring-center">
                    <div class="stat-val" id="val-meaning">50</div>
                    <div class="stat-lbl">🌟 意义</div>
                </div>
            </div>
            <div class="stat-ring" data-key="money">
                <svg viewBox="0 0 100 100" class="ring-svg">
                    <circle class="ring-bg" cx="50" cy="50" r="42"></circle>
                    <circle class="ring-fg" id="ring-money" cx="50" cy="50" r="42"></circle>
                </svg>
                <div class="ring-center">
                    <div class="stat-val" id="val-money">50</div>
                    <div class="stat-lbl">💰 收益</div>
                </div>
            </div>
        </div>

        <div class="event-container">
            <div class="event-desc" id="event-text">正在加载...</div>
            <div class="action-btns">
                <div class="act-btn" id="btn-a" onclick="Game.handleAction(0)">选项 A</div>
                <div class="act-btn" id="btn-b" onclick="Game.handleAction(1)">选项 B</div>
                
                <!-- 新增：撤回按钮 -->
                <button id="btn-back" class="btn-back" style="display: none;" onclick="Game.goBack()">↩ 撤回上一题</button>
            </div>
        </div>
    </div>

    <!-- 4. 结果页 -->
    <div id="screen-result" class="container">
        <div class="screen result-screen">
            <div id="result-content">
                <!-- 结果由JS生成 -->
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
