<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>职业觉醒实验室 V16 - 修复版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: rgba(255, 255, 255, 0.06);
            --accent-color: #00ff88;
            --text-main: #ffffff;
            --font-main: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        /* 主题配色 */
        .theme-coder { --accent-color: #00ff88; --glow: rgba(0, 255, 136, 0.15); }
        .theme-finance { --accent-color: #ffd700; --glow: rgba(255, 215, 0, 0.15); }
        .theme-soe { --accent-color: #ff6b6b; --glow: rgba(255, 107, 107, 0.15); }
        .theme-civil { --accent-color: #48dbfb; --glow: rgba(72, 219, 251, 0.15); }
        .theme-academic { --accent-color: #a55eea; --glow: rgba(165, 94, 234, 0.15); }
        .theme-medical { --accent-color: #2ecc71; --glow: rgba(46, 204, 113, 0.15); }

        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main); font-family: var(--font-main); overflow-x: hidden; min-height: 100vh; }
        .bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; background: radial-gradient(circle at 50% 0%, var(--glow) 0%, transparent 50%); opacity: 0.6; }
        
        /* 布局 */
        .container { max-width: 640px; margin: 0 auto; padding: 20px; box-sizing: border-box; min-height: 100vh; display: none; flex-direction: column; justify-content: center; }
        .container.active { display: flex; }
        .screen { width: 100%; text-align: center; }

        /* 首页 */
        .main-title { font-size: 34px; font-weight: 900; margin-bottom: 10px; background: linear-gradient(to right, #fff, #aaa); -webkit-background-clip: text; color: transparent; }
        .sub-title { font-size: 13px; color: #666; margin-bottom: 50px; letter-spacing: 1px; }
        
        .id-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .id-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 40px 20px; cursor: pointer; transition: all 0.3s; }
        .id-card:active { border-color: var(--accent-color); background: rgba(255,255,255,0.08); }
        .id-icon { font-size: 48px; margin-bottom: 15px; display: block; }
        .id-name { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
        .id-desc { font-size: 12px; color: #888; line-height: 1.5; }

        /* 角色选择 */
        .role-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .role-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 25px 10px; cursor: pointer; transition: all 0.2s; }
        .role-card:active { transform: scale(0.98); border-color: var(--accent-color); }
        .role-icon { font-size: 32px; margin-bottom: 10px; display: block; }
        .role-name { font-size: 16px; font-weight: bold; }

        /* 游戏界面 */
        .game-hud { position: fixed; top: 0; left: 0; right: 0; padding: 15px 20px; background: rgba(0,0,0,0.85); display: flex; justify-content: space-between; z-index: 100; font-size: 13px; color: #aaa; backdrop-filter: blur(10px); }
        .stats-row { display: flex; justify-content: space-around; margin-bottom: 30px; padding-top: 50px; }
        .stat-orb { width: 80px; height: 80px; border-radius: 50%; background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.3s; }
        .stat-val { font-size: 22px; font-weight: 900; color: #fff; }
        .stat-lbl { font-size: 10px; color: #888; margin-top: 2px; }

        .event-container { background: var(--card-bg); border-radius: 24px; padding: 35px 30px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .event-desc { font-size: 18px; line-height: 1.8; margin-bottom: 35px; min-height: 80px; color: #eee; }
        .action-btns { display: flex; flex-direction: column; gap: 15px; }
        .act-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); color: #ccc; padding: 18px 20px; border-radius: 14px; text-align: left; cursor: pointer; font-size: 15px; transition: all 0.2s; line-height: 1.4; }
        .act-btn:active { background: rgba(255,255,255,0.1); border-color: var(--accent-color); color: #fff; }

        /* 结果页通用 */
        .result-screen { text-align: left; }
        .report-card { background: linear-gradient(145deg, #1a1a1c 0%, #222226 100%); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 30px; margin-bottom: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); }
        .report-header { display: flex; align-items: center; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .report-icon { font-size: 36px; margin-right: 15px; }
        .report-title { font-size: 20px; font-weight: 900; color: #fff; }
        .report-sub { font-size: 12px; color: #666; display: block; margin-top: 4px; }

        /* 雷达图模拟 */
        .radar-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .radar-item { background: rgba(0,0,0,0.2); border-radius: 10px; padding: 12px; display: flex; align-items: center; justify-content: space-between; }
        .radar-name { font-size: 12px; color: #aaa; }
        .radar-score { font-size: 14px; font-weight: bold; color: var(--accent-color); }
        
        /* 状态条 */
        .status-item { margin-bottom: 15px; }
        .status-header { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: #ccc; }
        .status-track { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .status-fill { height: 100%; border-radius: 4px; transition: width 1s ease; }
        .fill-good { background: #2ecc71; }
        .fill-warn { background: #f1c40f; }
        .fill-bad { background: #e74c3c; }

        /* 诊断卡片 */
        .diag-box { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 20px; margin-top: 20px; border-left: 4px solid var(--accent-color); }
        .diag-title { font-size: 14px; font-weight: bold; color: var(--accent-color); margin-bottom: 10px; }
        .diag-text { font-size: 13px; line-height: 1.6; color: #ddd; }

        /* 推荐卡片 */
        .rec-card { background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.15); border-radius: 12px; padding: 15px; margin-top: 15px; }
        .rec-title { font-size: 12px; color: #888; margin-bottom: 5px; }
        .rec-role { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .rec-desc { font-size: 12px; color: #aaa; }

        .btn-restart { background: var(--accent-color); color: #000; font-weight: bold; border: none; padding: 15px 30px; border-radius: 30px; margin-top: 10px; cursor: pointer; width: 100%; font-size: 16px; transition: transform 0.1s; }
        .btn-restart:active { transform: scale(0.98); }
    </style>
</head>
<body class="theme-coder">
<div class="bg-layer"></div>

<!-- 1. 身份选择页 -->
<div class="container active" id="screen-id">
    <div class="screen">
        <h1 class="main-title">职业觉醒实验室</h1>
        <p class="sub-title">深度体验版 V16 | 这里没有标准答案，只有真实的你</p>
        <div class="id-grid">
            <div class="id-card" onclick="selectIdentity('student')">
                <span class="id-icon">🎓</span>
                <div class="id-name">我是学生</div>
                <div class="id-desc">面对未来，我想知道自己适合走向何方</div>
            </div>
            <div class="id-card" onclick="selectIdentity('worker')">
                <span class="id-icon">💼</span>
                <div class="id-name">我是打工人</div>
                <div class="id-desc">面对当下，我想确认此刻的状态是否健康</div>
            </div>
        </div>
    </div>
</div>

<!-- 2. 角色选择页 -->
<div class="container" id="screen-role">
    <div class="screen">
        <h2 style="font-size:18px; margin-bottom:30px; color:#aaa;">选择一个你想代入的角色剧本：</h2>
        <div class="role-grid">
            <div class="role-card" onclick="startGame('coder')"><span class="role-icon">💻</span><div class="role-name">程序员</div></div>
            <div class="role-card" onclick="startGame('finance')"><span class="role-icon">💰</span><div class="role-name">金融民工</div></div>
            <div class="role-card" onclick="startGame('soe')"><span class="role-icon">🏭</span><div class="role-name">央企职员</div></div>
            <div class="role-card" onclick="startGame('civil')"><span class="role-icon">🏛️</span><div class="role-name">体制内</div></div>
            <div class="role-card" onclick="startGame('academic')"><span class="role-icon">📚</span><div class="role-name">高校青椒</div></div>
            <div class="role-card" onclick="startGame('medical')"><span class="role-icon">⚕️</span><div class="role-name">医务工作者</div></div>
        </div>
    </div>
</div>

<!-- 3. 游戏页 -->
<div class="container" id="screen-game">
    <div class="screen">
        <div class="game-hud">
            <span id="hud-time">周一 09:00</span>
            <span id="hud-hint">决策中...</span>
        </div>
        <div class="stats-row">
            <div class="stat-orb"><span class="stat-val" id="val-energy">50</span><span class="stat-lbl">⚡️ 能量</span></div>
            <div class="stat-orb"><span class="stat-val" id="val-meaning">50</span><span class="stat-lbl">🌟 意义</span></div>
            <div class="stat-orb"><span class="stat-val" id="val-money">50</span><span class="stat-lbl">💰 收益</span></div>
        </div>
        <div class="event-container">
            <div class="event-desc" id="event-text">正在加载情境...</div>
            <div class="action-btns">
                <button class="act-btn" id="btn-a" onclick="handleAction('do')">A</button>
                <button class="act-btn" id="btn-b" onclick="handleAction('reject')">B</button>
            </div>
        </div>
    </div>
</div>

<!-- 4. 结果页 -->
<div class="container" id="screen-result">
    <div class="screen">
        <div class="result-screen" id="result-content">
            <!-- 动态生成 -->
        </div>
    </div>
</div>

<script>
    let userIdentity = 'student';
    let currentRole = '';
    let state = { energy: 50, meaning: 50, money: 50, tracks: { tech: 0, influence: 0, freedom: 0, security: 0, service: 0, challenge: 0 } };
    let currentEventIndex = 0, currentEvents = [];
    const timeStamps = ["周一 09:00", "周二 14:00", "周三 10:00", "周四 20:00", "周五 16:00"];

    // 【修复】事件库：修复了字符串引号缺失的问题
    const allEvents = {
        coder: [
            { 
                text: "周五下午4点，产品经理突然发给你一份新需求文档，说“很简单，下周一上线”。你打开一看，涉及底层逻辑改动。", 
                choices: { 
                    do: { text: "立即找产品经理过需求，明确风险，争取延期或砍需求。", effects: {e:-10,m:5,y:0}, track: "influence" }, 
                    reject: { text: "为了不被认为“难搞”，先答应下来，大不了周末加班赶工。", effects: {e:-15,m:-5,y:5}, track: "security" } 
                } 
            },
            { 
                text: "你在维护一个三年前的老项目，发现一段“祖传代码”逻辑混乱且没有注释。目前功能没报错，但随时可能崩。", 
                choices: { 
                    do: { text: "忍不住重构了它，并补全了单元测试，虽然这不在KPI里。", effects: {e:-20,m:15,y:0}, track: "tech" }, 
                    reject: { text: "能跑就不动，加上 TODO 注释，假装自己没看见。", effects: {e:-5,m:-5,y:5}, track: "security" } 
                } 
            },
            { 
                text: "公司宣布实行“大小周”，加班费按最低工资标准算。同事们都在私下吐槽，但没人敢说话。", 
                choices: { 
                    do: { text: "这是我的福报，默默打开IDE开始干活。", effects: {e:-30,m:-10,y:10}, track: "challenge" }, 
                    reject: { text: "打开招聘网站，更新简历，看看外企的机会。", effects: {e:5,m:10,y:-5}, track: "freedom" } 
                } 
            },
            { 
                text: "凌晨2点，你刚躺下，线上服务器突然报警，电话狂响。你是当值的第一责任人。", 
                choices: { 
                    do: { text: "秒级响应，登录VPN开始排查，哪怕明天还要开会。", effects: {e:-25,m:10,y:0}, track: "tech" }, 
                    reject: { text: "太累了，装睡没听见，等备用负责人或者明天再说。", effects: {e:5,m:-20,y:-10}, track: "security" } 
                } 
            },
            { 
                text: "你发现一个新的开源框架很火，虽然项目目前用不上，但你觉得它代表了未来趋势。", 
                choices: { 
                    do: { text: "周末自己钻研，写个Demo博客，享受技术探索的乐趣。", effects: {e:-15,m:15,y:0}, track: "tech" }, 
                    reject: { text: "现在的技术栈够用就行，不花时间去学“屠龙之技”。", effects: {e:5,m:-5,y:0}, track: "security" } 
                } 
            },
            { 
                text: "隔壁组的实习生带来了家里的特产正在分发，大家都在闲聊。你的代码刚写到一半。", 
                choices: { 
                    do: { text: "合上电脑凑过去聊聊，认识一下新朋友，放松一下。", effects: {e:10,m:5,y:0}, track: "service" }, 
                    reject: { text: "戴上降噪耳机，在这个嘈杂的环境中继续专注编码。", effects: {e:-5,m:0,y:0}, track: "tech" } 
                } 
            }
        ],
        finance: [
            { 
                text: "IPO冲刺期，凌晨1点，群里领导@你核对一份底稿数据。你知道今晚不搞定，明天项目就会延期。", 
                choices: { 
                    do: { text: "强撑着眼皮爬起来，把数据核对完再睡。", effects: {e:-35,m:-5,y:20}, track: "challenge" }, 
                    reject: { text: "装睡，明早解释“睡太死没听见”，先保命。", effects: {e:10,m:-10,y:-10}, track: "freedom" } 
                } 
            },
            { 
                text: "你的大客户亏损了20%，情绪激动，直接打电话来骂人，质疑你的专业能力。", 
                choices: { 
                    do: { text: "专业安抚，发送详细的市场分析报告，用数据说话。", effects: {e:-20,m:-5,y:10}, track: "service" }, 
                    reject: { text: "转接客服部门，我不应该直接面对这种情绪垃圾。", effects: {e:5,m:-5,y:-5}, track: "security" } 
                } 
            },
            { 
                text: "尽调中，你发现目标公司的财务数据有疑点，但如果你指出来，这笔并购案可能黄了，团队奖金也没了。", 
                choices: { 
                    do: { text: "坚持原则，写进风险备忘录，哪怕得罪人。", effects: {e:-15,m:15,y:0}, track: "tech" }, 
                    reject: { text: "尽量淡化处理，先把材料交上去，出了事再说。", effects: {e:-5,m:-15,y:10}, track: "security" } 
                } 
            },
            { 
                text: "需要为明天的重要路演准备一份极具说服力的PPT。模板现成就有，但内容平平无奇。", 
                choices: { 
                    do: { text: "熬夜打磨，重新梳理逻辑，追求完美呈现。", effects: {e:-20,m:10,y:10}, track: "influence" }, 
                    reject: { text: "套用模板，数据差不多就行，结果主要看命。", effects: {e:-5,m:-5,y:5}, track: "security" } 
                } 
            }
        ],
        soe: [
            { 
                text: "你写的材料改了第8版，领导批示：“高度还不够，要再升华一下”。你一眼就看穿这就是形式主义。", 
                choices: { 
                    do: { text: "查阅过往文件，堆砌辞藻，改到领导满意为止。", effects: {e:-20,m:-15,y:0}, track: "security" }, 
                    reject: { text: "只改了两个标点符号，换个格式交差，反正没人细看。", effects: {e:5,m:-10,y:0}, track: "freedom" } 
                } 
            },
            { 
                text: "同事是典型的“关系户”，经常把工作推给你。他刚又把一个麻烦的报表扔给你。", 
                choices: { 
                    do: { text: "为了维持表面和平，帮他把活干了，不想惹事。", effects: {e:-15,m:-10,y:0}, track: "security" }, 
                    // 这里修复了引号
                    reject: { text: "当面拒绝：“我手头也紧，这个我真帮不了。”", effects: {e:5,m:5,y:0}, track: "freedom" } 
                } 
            },
            { 
                text: "单位组织拔河比赛，要求全员参加。你知道这只是为了拍几张照片宣传。", 
                choices: { 
                    do: { text: "喊破喉咙，表现得非常有团队精神，争取被领导看到。", effects: {e:-20,m:-5,y:5}, track: "influence" }, 
                    reject: { text: "站在后排最不起眼的位置，假装用力，实则摸鱼。", effects: {e:0,m:-10,y:0}, track: "freedom" } 
                } 
            },
            { 
                text: "你提了一个创新降本方案，领导说：“想法不错，但先放放，等上面有精神再说”。", 
                choices: { 
                    do: { text: "私下继续完善方案，找机会向更高级领导汇报。", effects: {e:-10,m:10,y:0}, track: "challenge" }, 
                    reject: { text: "算了，多一事不如少一事，按老规矩来。", effects: {e:5,m:-15,y:0}, track: "security" } 
                } 
            }
        ],
        civil: [
            { 
                text: "办事大厅来了一位情绪激动的群众，拍桌子大喊“有黑幕”。周围群众都在围观拍照。", 
                choices: { 
                    do: { text: "倒杯水递过去，耐心解释政策，安抚情绪。", effects: {e:-25,m:20,y:0}, track: "service" }, 
                    reject: { text: "保持距离，呼叫保安维持秩序，按流程办事。", effects: {e:-5,m:-15,y:0}, track: "security" } 
                } 
            },
            { 
                text: "上级周五突然通知周一要报数据，时间紧，只能“统计加估计”。这明显不符合数据真实原则。", 
                choices: { 
                    do: { text: "加班查阅原始档案，尽量拉出接近真实的数据。", effects: {e:-20,m:5,y:0}, track: "tech" }, 
                    reject: { text: "按经验估算填表，先交上去应付检查。", effects: {e:-5,m:-10,y:0}, track: "security" } 
                } 
            },
            { 
                text: "政策一刀切，明显不适合本地实际情况，执行下去会引发群众抱怨。", 
                choices: { 
                    do: { text: "准备书面建议和调研报告，向上级争取调整空间。", effects: {e:-15,m:15,y:0}, track: "influence" }, 
                    reject: { text: "照搬文件执行，不说话，法无禁止即可为。", effects: {e:5,m:-10,y:0}, track: "security" } 
                } 
            },
            { 
                text: "春节值班表出来了，大年三十没人愿意去。领导在群里问“谁可以顶一下”。", 
                choices: { 
                    do: { text: "主动报名，反正回家也是闲着，还能拿三倍工资。", effects: {e:-10,m:5,y:15}, track: "service" }, 
                    reject: { text: "假装没看见群消息，等别人接话。", effects: {e:5,m:-5,y:0}, track: "security" } 
                } 
            }
        ],
        academic: [
            { 
                text: "收到拒稿邮件，审稿意见是“创新性不足”。你投了这个刊已经折腾了半年。", 
                choices: { 
                    do: { text: "调整实验方案，换个刊重投，科研就是打不死的小强。", effects: {e:-15,m:-10,y:0}, track: "tech" }, 
                    reject: { text: "先放一放，换个容易发的方向，保命要紧。", effects: {e:5,m:-20,y:0}, track: "security" } 
                } 
            },
            { 
                text: "学校要求“非升即走”，三年发三篇核心，还要承担新课教学。", 
                choices: { 
                    do: { text: "拼命挤时间，把课备好、论文写完，拼一把编制。", effects: {e:-30,m:-15,y:0}, track: "challenge" }, 
                    reject: { text: "课能水就水，精力主要放在论文上，先过考核。", effects: {e:-5,m:-5,y:0}, track: "tech" } 
                } 
            },
            { 
                text: "学生上课玩手机，你提醒后他依然在刷。", 
                choices: { 
                    do: { text: "课后找他谈话，严肃课堂纪律，试图纠正学风。", effects: {e:-15,m:5,y:0}, track: "influence" }, 
                    reject: { text: "只要不影响别人，装没看见，把课上完就行。", effects: {e:0,m:-5,y:0}, track: "freedom" } 
                } 
            },
            { 
                text: "有本科生想进你的实验室“打杂”，但他基础很差，教他比自己做还累。", 
                choices: { 
                    do: { text: "收下他，手把手带，培养新人是老师的责任。", effects: {e:-10,m:5,y:0}, track: "service" }, 
                    reject: { text: "婉拒，这会影响我的科研进度。", effects: {e:5,m:-5,y:0}, track: "tech" } 
                } 
            }
        ],
        medical: [
            { 
                text: "凌晨3点，你想在值班室眯十分钟，家属堵门投诉说护士态度不好。", 
                choices: { 
                    do: { text: "起身道歉，解释情况，争取理解。", effects: {e:-20,m:5,y:0}, track: "service" }, 
                    reject: { text: "沉默起身，继续守在监护仪旁，不想卷入是非。", effects: {e:-5,m:-10,y:0}, track: "security" } 
                } 
            },
            { 
                text: "患者嫌换药收费贵，网上吐槽“没技术含量，就几块钱纱布”。", 
                choices: { 
                    do: { text: "耐心解释操作规范、感染风险和成本。", effects: {e:-15,m:5,y:0}, track: "service" }, 
                    reject: { text: "“按规定收费”，不再多言，让医保办去解释。", effects: {e:-5,m:-5,y:0}, track: "security" } 
                } 
            },
            { 
                text: "你发现病历复制粘贴时，带进了上一位患者的姓名。", 
                choices: { 
                    do: { text: "立即报告科室，主动承认错误并整改。", effects: {e:-25,m:10,y:0}, track: "tech" }, 
                    reject: { text: "悄悄改掉，祈祷没人发现。", effects: {e:-5,m:-15,y:0}, track: "security" } 
                } 
            },
            { 
                text: "病人康复出院，家属写来感谢信，还塞给你一个红包。", 
                choices: { 
                    do: { text: "收下红包，事后交到科里充公，并回复感谢信。", effects: {e:0,m:10,y:10}, track: "security" }, 
                    reject: { text: "坚决拒收红包，把感谢信贴在科室墙上。", effects: {e:0,m:15,y:0}, track: "service" } 
                } 
            }
        ]
    };

    function selectIdentity(type) {
        userIdentity = type;
        showScreen('screen-role');
    }

    function showScreen(id) {
        document.querySelectorAll('.container').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function startGame(role) {
        document.body.className = `theme-${role}`;
        currentRole = role;
        
        let pool = allEvents[role] ? [...allEvents[role]] : [];
        // 兜底逻辑
        if(pool.length < 5) pool = pool.concat(allEvents.coder.slice(0, 5 - pool.length));

        // 洗牌
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        currentEvents = pool.slice(0, 5);

        state = { energy: 50, meaning: 50, money: 50, tracks: { tech: 0, influence: 0, freedom: 0, security: 0, service: 0, challenge: 0 } };
        currentEventIndex = 0;
        
        showScreen('screen-game');
        loadEvent(0);
    }

    function loadEvent(index) {
        document.getElementById('hud-time').innerText = timeStamps[index];
        const event = currentEvents[index];
        document.getElementById("event-text").innerText = event.text;
        document.getElementById("btn-a").innerText = event.choices.do.text;
        document.getElementById("btn-b").innerText = event.choices.reject.text;
    }

    function handleAction(type) {
        const event = currentEvents[currentEventIndex];
        const choice = event.choices[type];

        state.energy += choice.effects.e;
        state.meaning += choice.effects.m;
        state.money += choice.effects.y;
        state.energy = Math.max(0, Math.min(100, state.energy));
        state.meaning = Math.max(0, Math.min(100, state.meaning));
        state.money = Math.max(0, Math.min(100, state.money));
        if (choice.track) state.tracks[choice.track]++;

        document.getElementById('val-energy').innerText = state.energy;
        document.getElementById('val-meaning').innerText = state.meaning;
        document.getElementById('val-money').innerText = state.money;

        currentEventIndex++;
        if (currentEventIndex >= 5) {
            showResult();
        } else {
            loadEvent(currentEventIndex);
        }
    }

    function showResult() {
        showScreen('screen-result');
        
        const sorted = Object.entries(state.tracks).sort((a, b) => b[1] - a[1]);
        const topTrack = sorted[0][0];

        const trackNames = { 
            tech: "技术创造", influence: "影响引领", freedom: "自由自主", 
            security: "安全稳定", service: "服务贡献", challenge: "挑战突破" 
        };
        const topTrackName = trackNames[topTrack];
        
        let html = '';

        if (userIdentity === 'student') {
            // --- 学生版：潜力地图 ---
            html = `
            <div class="report-card">
                <div class="report-header">
                    <span class="report-icon">🗺️</span>
                    <div>
                        <div class="report-title">职业潜力地图</div>
                        <span class="report-sub">基于你的本能偏好分析</span>
                    </div>
                </div>
                
                <div class="radar-grid">
                    ${sorted.map(([key, value]) => `
                        <div class="radar-item">
                            <span class="radar-name">${trackNames[key]}</span>
                            <span class="radar-score">${value} 分</span>
                        </div>
                    `).join('')}
                </div>

                <div class="diag-box">
                    <div class="diag-title">💡 核心特质解读</div>
                    <div class="diag-text">
                        你在模拟中展现出的最高特质是 <strong>「${topTrackName}」</strong>。<br>
                        这意味着在真实职场中，当你处于能发挥该特质的环境时，你最容易产生“心流”体验，成长速度也会最快。你的能量值（${state.energy}%）显示了你目前对压力的耐受力。
                    </div>
                </div>

                <div class="rec-card">
                    <div class="rec-title">🚀 推荐起步方向</div>
                    <div class="rec-role">${getCareerSuggestion(topTrack).split('/')[0]}</div>
                    <div class="rec-desc">建议你在实习或第一份工作中，优先寻找能接触该核心职能的岗位。</div>
                </div>
            </div>
            <button class="btn-restart" onclick="location.reload()">重新探索</button>
            `;
        } else {
            // --- 打工人版：体检报告 ---
            
            // 判断状态颜色
            const energyColor = state.energy < 30 ? 'bad' : (state.energy < 60 ? 'warn' : 'good');
            const meaningColor = state.meaning < 30 ? 'bad' : (state.meaning < 60 ? 'warn' : 'good');
            
            // 职业匹配度分析
            const roleMap = { coder: 'tech', finance: 'challenge', soe: 'security', civil: 'service', academic: 'tech', medical: 'service' };
            const roleNeed = roleMap[currentRole];
            const matchScore = state.tracks[roleNeed] || 0;
            const matchColor = matchScore >= 3 ? 'good' : (matchScore >= 1 ? 'warn' : 'bad');
            const matchText = matchScore >= 3 ? '高度匹配' : (matchScore >= 1 ? '存在错位' : '严重错位');

            html = `
            <div class="report-card">
                <div class="report-header">
                    <span class="report-icon">🏥</span>
                    <div>
                        <div class="report-title">职业状态体检报告</div>
                        <span class="report-sub">生成时间：${new Date().toLocaleDateString()}</span>
                    </div>
                </div>

                <div class="status-item">
                    <div class="status-header"><span>⚡️ 能量储备</span><span>${state.energy}%</span></div>
                    <div class="status-track"><div class="status-fill fill-${energyColor}" style="width: ${state.energy}%"></div></div>
                </div>
                <div class="status-item">
                    <div class="status-header"><span>🌟 意义感</span><span>${state.meaning}%</span></div>
                    <div class="status-track"><div class="status-fill fill-${meaningColor}" style="width: ${state.meaning}%"></div></div>
                </div>

                <div class="diag-box" style="border-left-color: var(--accent-color);">
                    <div class="diag-title">⚖️ 人岗匹配度分析</div>
                    <div class="diag-text">
                        当前角色：<strong>${document.querySelector(`.role-card[onclick="startGame('${currentRole}')"] .role-name`).innerText}</strong><br>
                        你的内核：<strong>「${topTrackName}」</strong><br>
                        <div style="margin-top:10px;">
                            <div class="status-track" style="height:12px; border-radius:6px;">
                                <div class="status-fill fill-${matchColor}" style="width: ${matchScore * 20}%"></div>
                            </div>
                            <div style="font-size:12px; margin-top:5px; color:${matchColor === 'good' ? '#2ecc71' : (matchColor === 'warn' ? '#f1c40f' : '#e74c3c')};">
                                ${matchText}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="diag-box" style="border-left-color: #ffa502;">
                    <div class="diag-title">💊 诊断建议</div>
                    <div class="diag-text" style="white-space: pre-wrap;">${getAdvice(state, matchScore, topTrackName)}</div>
                </div>
            </div>
            <button class="btn-restart" onclick="location.reload()">重新体检</button>
            `;
        }

        document.getElementById('result-content').innerHTML = html;
    }

    function getCareerSuggestion(track) {
        const map = {
            tech: "研发工程师/数据科学家/技术专家",
            influence: "产品经理/项目管理/创业者",
            freedom: "自由职业/独立开发者/远程工作",
            security: "体制内/国企/大型集团职能岗",
            service: "客户成功/教育/咨询/运营",
            challenge: "早期创业核心成员/销售冠军/攻坚负责人"
        };
        return map[track] || "综合型岗位";
    }

    function getAdvice(s, match, topTrack) {
        if (match >= 3) {
            return `恭喜你！你的内核特质与当前职业高度契合。你找对了赛道。\n建议：\n1. 蓄力：多做一些能发挥「${topTrack}」优势的项目，打造核心竞争力。\n2. 平衡：注意能量值(${s.energy}%)，保持可持续的节奏。`;
        } else {
            return `警报：你的内核与当前工作存在错位。这可能是你感到“累”或“没意思”的根源。\n建议：\n1. 微调：在现有工作中，主动申请偏向「${topTrack}」的任务。\n2. 副业：下班后开启一个符合你特质的小项目，找回掌控感。\n3. 换行：如果能量值过低，不要裸辞，先做职业访谈。`;
        }
    }
</script>
</body>
</html>
